# XcodeGen spec.
#
# The .xcodeproj is generated rather than committed: a project file is a merge
# conflict generator, and this repository exists to be forked and vendored into
# a private release repo. Run `xcodegen generate` (brew install xcodegen) and
# open DailyOS.xcodeproj.
#
# If you would rather not install XcodeGen, see README §"Without XcodeGen" —
# creating the target by hand is a three-step job.

name: DailyOS
options:
  bundleIdPrefix: com.example.dailyos
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  DailyOS:
    path: .

targets:
  DailyOS:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: DailyOS
        product: DailyOSCore
      - package: DailyOS
        product: DailyOSMac
      - package: DailyOS
        product: DailyOSClient
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Daily OS
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        # Without this string macOS never shows the prompt and never grants
        # location — `CLLocationUpdate.liveUpdates()` simply yields nothing. The
        # weather strip would then take its 6-second timeout on every stale slot
        # and silently fall back to the default place *forever*, which looks
        # like a broken feature rather than a missing key.
        NSLocationWhenInUseUsageDescription: 今天页的天气用它确定你在哪。位置只用来请求天气，不上传、不保存。不给也能用，会回落到设置里的默认城市。
        # Shown in the 桌面／文稿 consent dialogs the app raises on first install.
        # Not cosmetic: the vault normally lives in one of these two folders, and
        # a background service that reads one without permission does not fail —
        # the read hangs forever, because a launchd job has nowhere to show the
        # dialog. Asking here, from a window that is on screen, is what makes
        # that grant exist before the service ever looks.
        NSDesktopFolderUsageDescription: 你的周期和笔记通常放在桌面上的 vault 里。Daily OS 只读你在设置里指定的那个目录，不碰桌面上的别的东西。
        NSDocumentsFolderUsageDescription: 你的周期和笔记通常放在「文稿」里的 vault 里。Daily OS 只读你在设置里指定的那个目录，不碰「文稿」里的别的东西。
        # The menu bar item is the always-available entry point, but this is not
        # an agent app — it has a real window and belongs in the Dock while open.
        LSUIElement: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dailyos.mac
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "6.0"
        # Universal, so one copy runs on both Apple Silicon and Intel. Xcode's
        # default builds only the machine you are sitting at, and an arm64-only
        # bundle handed to an Intel Mac fails with "应用程序不能打开" — a message
        # that says nothing about architecture and sends the recipient looking
        # for a permissions problem.
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: NO
        # Generated by `swift run daily-os-icon` from the same `DailyOSMark`
        # the app draws, and committed — a build that needs a code generator to
        # produce its app icon is a build that fails on the machine where
        # someone forgot to run it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # The daily-os service runs on localhost and this app is a client of it;
        # the sandbox's localhost restrictions would need an entitlement dance
        # that buys nothing for a single-user local tool.
        ENABLE_APP_SANDBOX: NO
